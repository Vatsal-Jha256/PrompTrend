[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "promptrend"
version = "1.0.0"
description = "Intent Classification and Contextual Bandit Recommendation System"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "fastapi==0.68.0",
    "uvicorn==0.15.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv==0.19.0",
    "sqlalchemy==1.4.23",
    "psycopg2-binary==2.9.1",
    "redis==4.1.0",
    "torch>=2.0.0",
    "transformers==4.11.3",
    "scikit-learn==0.24.2",
    "numpy==1.21.2",
    "pandas==1.3.3",
    "datasets==1.11.0",
    "accelerate>=0.21.0"
]

[project.scripts]
promptrend-server = "promptrend.app:start"

[project.optional-dependencies]
test = [
    "pytest==6.2.5",
    "httpx==0.18.2",
    "pytest-asyncio==0.15.1"
]

[tool.setuptools.packages.find]
include = ["promptrend*"]
